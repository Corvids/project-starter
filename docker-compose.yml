name: starter-project

x-database-url: &database-url "postgresql://${POSTGRES_USER:-db_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-metrics_store}"
x-redis-url: &redis-url "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0"

services:
  postgres:
    image: postgres:19.0-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-metrics_store}
    # Postgres 18+ keeps data in /var/lib/postgresql/<major>/docker.
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.12.0-alpine
    restart: unless-stopped
    mem_limit: 64m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # The password is read from the container environment at runtime, not
    # interpolated into this file. maxmemory stays below mem_limit.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 48mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: applies pending migrations, then exits. web waits for it.
  # restart is "no" on purpose: unless-stopped would re-run it in a loop after
  # it exits 0, and web could never see service_completed_successfully.
  migrate:
    build:
      context: ./app
      target: dev
    image: starter-project/dev:local
    restart: "no"
    mem_limit: 256m
    # The bind mount hides the client generated in the image, so write it into
    # ./app/src/generated (git-ignored) before web starts. deploy applies
    # existing migrations only. Create a new one with:
    # docker compose run --rm migrate npx prisma migrate dev --name <change>
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && npx prisma db seed"]
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    environment:
      DATABASE_URL: *database-url
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./app
      target: dev
    image: starter-project/dev:local
    container_name: starter-project
    restart: unless-stopped
    mem_limit: 1g
    command: ["npm", "run", "dev"]
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - backend_network
      - monitoring_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - monitoring_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  # internal: no route to the host or the internet. Only web bridges both networks.
  backend_network:
    internal: true
  monitoring_network: {}

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
